<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pollinations 버튼 선택 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; }
    </style>
</head>
<body class="text-white min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-blue-400">
            🎨 Pollinations 선택 버튼 테스트
        </h1>

        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-bold mb-4 text-green-400">📋 테스트 시나리오</h2>
            
            <div class="space-y-4 text-sm">
                <div class="bg-slate-900/60 p-3 rounded-lg border-l-4 border-purple-500">
                    <h3 class="font-bold text-purple-400 mb-1">1. 기본 모드 확인</h3>
                    <p class="text-slate-400">모달 열기 시 Gemini가 기본 선택되어 있는지 확인</p>
                </div>

                <div class="bg-slate-900/60 p-3 rounded-lg border-l-4 border-blue-500">
                    <h3 class="font-bold text-blue-400 mb-1">2. Pollinations 모드 전환</h3>
                    <p class="text-slate-400">Pollinations 버튼 클릭 시 UI와 제목이 변경되는지 확인</p>
                </div>

                <div class="bg-slate-900/60 p-3 rounded-lg border-l-4 border-green-500">
                    <h3 class="font-bold text-green-400 mb-1">3. 이미지 생성 테스트</h3>
                    <p class="text-slate-400">Pollinations 모드에서 실제 이미지 생성이 작동하는지 확인</p>
                </div>
            </div>
            
            <button onclick="openGrokModal()" class="mt-6 w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-lg font-bold text-lg">
                🎨 이미지 생성 모달 열기
            </button>
        </div>

        <div id="testResult" class="bg-slate-800 rounded-lg p-6 hidden">
            <h2 class="text-xl font-bold mb-4 text-green-400">✅ 테스트 결과</h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <!-- 모달 UI -->
    <div id="grokModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden px-4 py-6"
         onclick="if(event.target===this) closeGrokModal()">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center px-6 py-4 border-b border-slate-700 flex-shrink-0">
          <div class="flex-1">
            <h3 id="grokModalTitle" class="text-base font-bold text-blue-300">🎨 Gemini Imagen 이미지 생성</h3>
            <p id="grokModalSubtitle" class="text-xs text-slate-400 mt-0.5">프롬프트 검증 → Gemini Imagen 4 생성 · 스크립트/자막 편집 · 전체 내보내기</p>
          </div>
          <div class="flex items-center gap-3 ml-4">
            <!-- 생성 엔진 선택 버튼 -->
            <div class="flex bg-slate-900/60 rounded-lg p-0.5 border border-slate-600">
              <button id="geminiModeBtn" onclick="selectImageMode('gemini')" 
                class="px-3 py-1.5 text-xs font-bold rounded-md transition bg-blue-600 text-white">
                Gemini
              </button>
              <button id="pollinationsModeBtn" onclick="selectImageMode('pollinations')" 
                class="px-3 py-1.5 text-xs font-bold rounded-md transition text-slate-400 hover:text-white">
                Pollinations
              </button>
            </div>
            <button onclick="closeGrokModal()" class="text-slate-400 hover:text-white text-xl leading-none">✕</button>
          </div>
        </div>
        <div id="grokModalBody" class="overflow-y-auto p-6 flex-1 text-sm"></div>
      </div>
    </div>

    <script>
        // 전역 변수
        let currentImageMode = 'gemini';
        window.GEMINI_API_KEY = 'test-key';
        
        // 모달 함수들
        function openGrokModal() {
            const modal = document.getElementById('grokModal');
            const modalBody = document.getElementById('grokModalBody');
            
            modal.classList.remove('hidden');
            
            // 간단한 테스트 UI 생성
            modalBody.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700">
                        <h3 class="text-sm font-bold text-slate-300 mb-2">현재 모드: <span id="currentMode">Gemini</span></h3>
                        <p class="text-xs text-slate-400">위의 버튼을 클릭하여 모드를 변경해보세요</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm text-slate-300 mb-2">테스트 프롬프트:</label>
                        <textarea id="testPrompt" rows="3" 
                          placeholder="A beautiful sunset over mountains, cinematic style"
                          class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white resize-none"></textarea>
                    </div>
                    
                    <button onclick="testImageGeneration()" 
                      class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold rounded-lg transition">
                      🎨 이미지 생성 테스트
                    </button>
                    
                    <div id="testImageResult" class="hidden">
                        <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700">
                            <h3 class="text-sm font-bold text-green-400 mb-2">✅ 테스트 결과:</h3>
                            <img id="testImage" class="w-full rounded-lg mb-2" />
                            <p id="testStatus" class="text-xs text-slate-400"></p>
                        </div>
                    </div>
                </div>
            `;
            
            showTestResult();
        }
        
        function closeGrokModal() {
            const modal = document.getElementById('grokModal');
            modal.classList.add('hidden');
        }
        
        // 이미지 모드 선택 함수
        function selectImageMode(mode) {
            currentImageMode = mode;
            
            // UI 버튼 스타일 업데이트
            const geminiBtn = document.getElementById('geminiModeBtn');
            const pollinationsBtn = document.getElementById('pollinationsModeBtn');
            
            if (mode === 'gemini') {
                if (geminiBtn) {
                    geminiBtn.className = 'px-3 py-1.5 text-xs font-bold rounded-md transition bg-blue-600 text-white';
                }
                if (pollinationsBtn) {
                    pollinationsBtn.className = 'px-3 py-1.5 text-xs font-bold rounded-md transition text-slate-400 hover:text-white';
                }
            } else {
                if (geminiBtn) {
                    geminiBtn.className = 'px-3 py-1.5 text-xs font-bold rounded-md transition text-slate-400 hover:text-white';
                }
                if (pollinationsBtn) {
                    pollinationsBtn.className = 'px-3 py-1.5 text-xs font-bold rounded-md transition bg-purple-600 text-white';
                }
            }
            
            // 모달 헤더 업데이트
            const modalTitle = document.getElementById('grokModalTitle');
            const modalSubtitle = document.getElementById('grokModalSubtitle');
            
            if (modalTitle) {
                modalTitle.textContent = mode === 'gemini' 
                    ? '🎨 Gemini Imagen 이미지 생성' 
                    : '🎨 Pollinations AI 이미지 생성';
            }
            
            if (modalSubtitle) {
                modalSubtitle.textContent = mode === 'gemini'
                    ? '프롬프트 검증 → Gemini Imagen 4 생성 · 스크립트/자막 편집 · 전체 내보내기'
                    : '무료 AI 이미지 생성 · Flux 모델 · HD 해상도 · 빠른 생성';
            }
            
            // 모달 내부 현재 모드 표시 업데이트
            const currentModeEl = document.getElementById('currentMode');
            if (currentModeEl) {
                currentModeEl.textContent = mode === 'gemini' ? 'Gemini' : 'Pollinations';
            }
            
            console.log(`✅ 이미지 생성 모드 변경: ${mode}`);
        }
        
        // 이미지 생성 테스트 함수
        async function testImageGeneration() {
            const prompt = document.getElementById('testPrompt').value.trim();
            const resultDiv = document.getElementById('testImageResult');
            const imgEl = document.getElementById('testImage');
            const statusEl = document.getElementById('testStatus');
            
            if (!prompt) {
                alert('프롬프트를 입력해주세요.');
                return;
            }
            
            resultDiv.classList.remove('hidden');
            statusEl.textContent = `${currentImageMode === 'gemini' ? 'Gemini' : 'Pollinations'}로 이미지 생성 중...`;
            statusEl.className = 'text-xs text-blue-400';
            
            try {
                if (currentImageMode === 'pollinations') {
                    await generateImageWithPollinations(prompt, imgEl, statusEl, 0);
                } else {
                    // Gemini는 테스트용 모의 구현
                    statusEl.textContent = 'Gemini Imagen 테스트 모드 (실제 API 키 필요)';
                    statusEl.className = 'text-xs text-yellow-400';
                    imgEl.src = 'https://via.placeholder.com/800x450/1e293b/94a3b8?text=Gemini+Test+Mode';
                }
            } catch (error) {
                console.error('이미지 생성 오류:', error);
                statusEl.textContent = `❌ 오류: ${error.message}`;
                statusEl.className = 'text-xs text-red-400';
            }
        }
        
        // Pollinations 이미지 생성 함수 (복사)
        async function generateImageWithPollinations(prompt, imageElement, statusElement, idx) {
            if (!prompt) {
                throw new Error('프롬프트가 필요합니다.');
            }
            
            if (statusElement) {
                statusElement.textContent = '🎨 Pollinations AI로 이미지 생성 중...';
                statusElement.className = 'text-xs text-purple-400';
            }
            
            try {
                // Pollinations API URL 생성
                const seed = Math.floor(Math.random() * 1000000);
                const params = new URLSearchParams({
                    width: '1920',
                    height: '1080',
                    seed: seed.toString(),
                    nologo: 'true',
                    model: 'flux'
                });
                
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?${params}`;
                
                // 이미지 로드 테스트
                await new Promise((resolve, reject) => {
                    const img = new Image();
                    
                    const timeout = setTimeout(() => {
                        reject(new Error('이미지 생성 시간 초과 (30초)'));
                    }, 30000);
                    
                    img.onload = () => {
                        clearTimeout(timeout);
                        if (imageElement) {
                            imageElement.src = imageUrl;
                            imageElement.alt = `Generated by Pollinations: ${prompt}`;
                        }
                        
                        if (statusElement) {
                            statusElement.textContent = '✅ Pollinations 이미지 생성 완료!';
                            statusElement.className = 'text-xs text-green-400';
                        }
                        
                        resolve();
                    };
                    
                    img.onerror = () => {
                        clearTimeout(timeout);
                        reject(new Error('Pollinations 이미지 로드 실패'));
                    };
                    
                    img.src = imageUrl;
                });
                
                return imageUrl;
                
            } catch (error) {
                if (statusElement) {
                    statusElement.textContent = `❌ 오류: ${error.message}`;
                    statusElement.className = 'text-xs text-red-400';
                }
                throw error;
            }
        }
        
        function showTestResult() {
            const result = document.getElementById('testResult');
            const content = document.getElementById('resultContent');
            
            result.classList.remove('hidden');
            
            content.innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="text-green-400">✅</span>
                        <span class="text-sm">Gemini/Pollinations 선택 버튼이 추가되었습니다</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-green-400">✅</span>
                        <span class="text-sm">모드 전환 시 UI와 제목이 변경됩니다</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-green-400">✅</span>
                        <span class="text-sm">Pollinations API가 연동되어 실제 이미지 생성이 가능합니다</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-green-400">✅</span>
                        <span class="text-sm">기존 Gemini 모드도 유지됩니다</span>
                    </div>
                    <div class="mt-4 p-3 bg-slate-900 rounded">
                        <p class="text-xs text-slate-400">
                            이제 사용자가 이미지 생성 모달에서 Gemini Imagen 또는 Pollinations를 
                            선택하여 사용할 수 있습니다. Pollinations는 무료이며 빠른 생성이 가능합니다.
                        </p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
