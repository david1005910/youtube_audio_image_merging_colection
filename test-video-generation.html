<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영상 생성 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">영상 생성 테스트</h1>
        
        <!-- 이미지 영상 변환 테스트 -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">1. 이미지 → 영상 변환</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">이미지 URL</label>
                    <input type="text" id="imageUrl" 
                           class="w-full p-2 border rounded"
                           placeholder="https://picsum.photos/1920/1080"
                           value="https://picsum.photos/1920/1080">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">자막 텍스트</label>
                    <input type="text" id="subtitle" 
                           class="w-full p-2 border rounded"
                           placeholder="테스트 자막"
                           value="안녕하세요, 영상 생성 테스트입니다!">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">재생 시간 (초)</label>
                    <input type="number" id="duration" 
                           class="w-full p-2 border rounded"
                           value="5">
                </div>
                <button onclick="testImageToVideo()" 
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    이미지 영상 생성
                </button>
                <div id="imageResult" class="mt-4"></div>
            </div>
        </div>

        <!-- Pollinations 이미지 생성 + 영상 변환 -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">2. AI 이미지 생성 → 영상 변환</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">이미지 프롬프트</label>
                    <textarea id="imagePrompt" 
                              class="w-full p-2 border rounded h-24"
                              placeholder="생성할 이미지 설명">A beautiful sunset over mountains with golden clouds, cinematic lighting, 4K ultra detailed</textarea>
                </div>
                <button onclick="testPollinationsToVideo()" 
                        class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
                    AI 이미지 생성 후 영상 변환
                </button>
                <div id="aiImageResult" class="mt-4"></div>
            </div>
        </div>

        <!-- 슬라이드쇼 테스트 -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">3. 이미지 슬라이드쇼</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">제목</label>
                    <input type="text" id="slideshowTitle" 
                           class="w-full p-2 border rounded"
                           value="테스트 슬라이드쇼">
                </div>
                <button onclick="testSlideshow()" 
                        class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600">
                    슬라이드쇼 생성 (3장)
                </button>
                <div id="slideshowResult" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        async function testImageToVideo() {
            const resultDiv = document.getElementById('imageResult');
            resultDiv.innerHTML = '<div class="text-blue-500">영상 생성 중...</div>';
            
            try {
                const response = await fetch('http://localhost:8766/render-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageSrc: document.getElementById('imageUrl').value,
                        subtitle: document.getElementById('subtitle').value,
                        duration: parseInt(document.getElementById('duration').value),
                        fps: 30,
                        width: 1920,
                        height: 1080
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    resultDiv.innerHTML = `
                        <div class="text-green-500 mb-2">✅ 영상 생성 완료!</div>
                        <video controls class="w-full max-w-md rounded shadow">
                            <source src="${url}" type="video/mp4">
                        </video>
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML = `<div class="text-red-500">❌ 오류: ${error.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="text-red-500">❌ 네트워크 오류: ${error.message}</div>`;
            }
        }

        async function testPollinationsToVideo() {
            const resultDiv = document.getElementById('aiImageResult');
            resultDiv.innerHTML = '<div class="text-blue-500">AI 이미지 생성 중...</div>';
            
            try {
                // 1. Pollinations로 이미지 생성
                const prompt = document.getElementById('imagePrompt').value;
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1920&height=1080&nologo=true`;
                
                resultDiv.innerHTML = `
                    <div class="text-blue-500">이미지 생성됨, 영상 변환 중...</div>
                    <img src="${imageUrl}" class="w-full max-w-md rounded shadow mb-4">
                `;
                
                // 2. 이미지를 영상으로 변환
                const response = await fetch('http://localhost:8766/render-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageSrc: imageUrl,
                        subtitle: 'AI Generated Scene',
                        duration: 5,
                        fps: 30,
                        width: 1920,
                        height: 1080
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    resultDiv.innerHTML += `
                        <div class="text-green-500 mb-2">✅ 영상 변환 완료!</div>
                        <video controls class="w-full max-w-md rounded shadow">
                            <source src="${url}" type="video/mp4">
                        </video>
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML += `<div class="text-red-500">❌ 영상 변환 오류: ${error.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="text-red-500">❌ 오류: ${error.message}</div>`;
            }
        }

        async function testSlideshow() {
            const resultDiv = document.getElementById('slideshowResult');
            resultDiv.innerHTML = '<div class="text-blue-500">슬라이드쇼 생성 중...</div>';
            
            try {
                // 테스트용 이미지 3장
                const images = [
                    { 
                        src: 'https://picsum.photos/1920/1080?random=1',
                        caption: '첫 번째 슬라이드',
                        duration: 3
                    },
                    {
                        src: 'https://picsum.photos/1920/1080?random=2',
                        caption: '두 번째 슬라이드',
                        duration: 3
                    },
                    {
                        src: 'https://picsum.photos/1920/1080?random=3',
                        caption: '마지막 슬라이드',
                        duration: 3
                    }
                ];

                const response = await fetch('http://localhost:8766/render-slideshow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        images: images,
                        title: document.getElementById('slideshowTitle').value,
                        fps: 30,
                        width: 1920,
                        height: 1080
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    resultDiv.innerHTML = `
                        <div class="text-green-500 mb-2">✅ 슬라이드쇼 생성 완료!</div>
                        <video controls class="w-full max-w-md rounded shadow">
                            <source src="${url}" type="video/mp4">
                        </video>
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML = `<div class="text-red-500">❌ 오류: ${JSON.stringify(error)}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="text-red-500">❌ 네트워크 오류: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
