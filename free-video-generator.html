<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>완전 무료 영상 생성 도구</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">🎬 100% 무료 영상 생성 (API 키 불필요)</h1>
        
        <!-- 1. Canvas 기반 영상 녹화 -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">1. Canvas 애니메이션 영상 녹화</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">텍스트</label>
                        <input type="text" id="canvasText" 
                               class="w-full p-2 border rounded"
                               value="YouTube Video">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">애니메이션 타입</label>
                        <select id="animType" class="w-full p-2 border rounded">
                            <option value="typing">타이핑 효과</option>
                            <option value="fade">페이드 인</option>
                            <option value="slide">슬라이드</option>
                            <option value="bounce">바운스</option>
                            <option value="particles">파티클</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button onclick="startCanvasRecording()" 
                            class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-semibold">
                        🔴 녹화 시작
                    </button>
                    <button onclick="stopCanvasRecording()" 
                            class="px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 font-semibold"
                            id="stopBtn" disabled>
                        ⏹ 녹화 정지
                    </button>
                </div>
                
                <canvas id="videoCanvas" width="1280" height="720" 
                        class="w-full border rounded shadow bg-black"></canvas>
                
                <div id="canvasResult"></div>
            </div>
        </div>

        <!-- 2. 이미지 시퀀스 영상 -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">2. 이미지 슬라이드쇼 영상 (FFmpeg)</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">이미지 테마</label>
                    <select id="imageTheme" class="w-full p-2 border rounded">
                        <option value="nature">자연 풍경</option>
                        <option value="city">도시 풍경</option>
                        <option value="abstract">추상 아트</option>
                        <option value="animals">동물</option>
                        <option value="tech">테크놀로지</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">이미지 개수</label>
                        <input type="number" id="imageCount" value="5" min="3" max="10" 
                               class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">각 이미지 재생 시간</label>
                        <input type="number" id="imageDuration" value="2" min="1" max="5" 
                               class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">전환 효과</label>
                        <select id="transitionType" class="w-full p-2 border rounded">
                            <option value="fade">페이드</option>
                            <option value="slide">슬라이드</option>
                            <option value="zoom">줌</option>
                            <option value="none">없음</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="createImageSequence()" 
                        class="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 font-semibold">
                    🎞️ 슬라이드쇼 생성
                </button>
                
                <div id="sequencePreview" class="grid grid-cols-5 gap-2"></div>
                <div id="sequenceResult"></div>
            </div>
        </div>

        <!-- 3. GIF to Video -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">3. GIF → MP4 변환</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">GIF URL 또는 키워드</label>
                    <input type="text" id="gifInput" 
                           class="w-full p-2 border rounded"
                           placeholder="cat, funny, reaction 등"
                           value="cat">
                </div>
                
                <button onclick="convertGifToVideo()" 
                        class="px-6 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 font-semibold">
                    🎬 GIF → 영상 변환
                </button>
                
                <div id="gifResult"></div>
            </div>
        </div>

        <!-- 4. 텍스트 기반 영상 -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">4. 텍스트 애니메이션 영상</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">텍스트 내용 (줄바꿈으로 구분)</label>
                    <textarea id="textContent" 
                              class="w-full p-2 border rounded h-32"
                              placeholder="첫 번째 텍스트&#10;두 번째 텍스트&#10;세 번째 텍스트">유튜브 영상 제작
AI로 더 쉽게
무료로 시작하세요</textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">배경 스타일</label>
                        <select id="bgStyle" class="w-full p-2 border rounded">
                            <option value="gradient">그라디언트</option>
                            <option value="solid">단색</option>
                            <option value="animated">애니메이션 배경</option>
                            <option value="particles">파티클 배경</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">폰트 스타일</label>
                        <select id="fontStyle" class="w-full p-2 border rounded">
                            <option value="bold">굵은 글씨</option>
                            <option value="elegant">우아한</option>
                            <option value="playful">재미있는</option>
                            <option value="tech">테크</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="createTextVideo()" 
                        class="px-6 py-3 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 font-semibold">
                    ✨ 텍스트 영상 생성
                </button>
                
                <div id="textVideoResult"></div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let animationId;
        let isRecording = false;

        // 1. Canvas 영상 녹화
        function startCanvasRecording() {
            const canvas = document.getElementById('videoCanvas');
            const ctx = canvas.getContext('2d');
            const text = document.getElementById('canvasText').value;
            const animType = document.getElementById('animType').value;
            
            // MediaRecorder 설정
            const stream = canvas.captureStream(30); // 30 fps
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 2500000
            });
            
            recordedChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                document.getElementById('canvasResult').innerHTML = `
                    <div class="mt-4">
                        <p class="text-green-500 font-semibold mb-2">✅ 영상 녹화 완료!</p>
                        <video controls class="w-full rounded shadow">
                            <source src="${url}" type="video/webm">
                        </video>
                        <a href="${url}" download="canvas-video.webm" 
                           class="inline-block mt-2 px-4 py-2 bg-blue-500 text-white rounded">
                            💾 다운로드
                        </a>
                    </div>
                `;
            };
            
            mediaRecorder.start();
            isRecording = true;
            
            document.getElementById('stopBtn').disabled = false;
            
            // 애니메이션 시작
            animateCanvas(ctx, text, animType);
        }

        function stopCanvasRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                cancelAnimationFrame(animationId);
                document.getElementById('stopBtn').disabled = true;
            }
        }

        // Canvas 애니메이션
        function animateCanvas(ctx, text, type) {
            const canvas = ctx.canvas;
            let frame = 0;
            
            function draw() {
                // 배경
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#667eea');
                gradient.addColorStop(1, '#764ba2');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 텍스트 설정
                ctx.font = 'bold 80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                // 애니메이션 타입별 처리
                if (type === 'typing') {
                    const chars = Math.floor(frame / 5);
                    const displayText = text.substring(0, chars);
                    ctx.fillText(displayText, centerX, centerY);
                } else if (type === 'fade') {
                    ctx.globalAlpha = Math.min(1, frame / 30);
                    ctx.fillText(text, centerX, centerY);
                    ctx.globalAlpha = 1;
                } else if (type === 'slide') {
                    const x = -canvas.width + (frame * 10);
                    ctx.fillText(text, Math.min(centerX, x), centerY);
                } else if (type === 'bounce') {
                    const y = centerY + Math.sin(frame * 0.1) * 50;
                    ctx.fillText(text, centerX, y);
                } else if (type === 'particles') {
                    ctx.fillText(text, centerX, centerY);
                    // 파티클 효과
                    for (let i = 0; i < 10; i++) {
                        const px = Math.random() * canvas.width;
                        const py = Math.random() * canvas.height;
                        const size = Math.random() * 3;
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = 'white';
                }
                
                frame++;
                if (isRecording) {
                    animationId = requestAnimationFrame(draw);
                }
            }
            
            draw();
        }

        // 2. 이미지 시퀀스 생성
        async function createImageSequence() {
            const theme = document.getElementById('imageTheme').value;
            const count = parseInt(document.getElementById('imageCount').value);
            const duration = parseInt(document.getElementById('imageDuration').value);
            const transition = document.getElementById('transitionType').value;
            
            const previewDiv = document.getElementById('sequencePreview');
            const resultDiv = document.getElementById('sequenceResult');
            
            // 이미지 미리보기 생성
            previewDiv.innerHTML = '';
            const images = [];
            
            for (let i = 0; i < count; i++) {
                const imageUrl = `https://picsum.photos/seed/${theme}-${i}/640/360`;
                images.push(imageUrl);
                
                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = 'rounded shadow';
                previewDiv.appendChild(img);
            }
            
            // FFmpeg 명령어 생성
            resultDiv.innerHTML = `
                <div class="mt-4 bg-green-50 border border-green-200 rounded p-4">
                    <p class="text-green-700 font-semibold mb-2">✅ 이미지 준비 완료!</p>
                    <p class="text-sm mb-2">FFmpeg 명령어:</p>
                    <code class="bg-gray-100 p-2 rounded block text-xs overflow-x-auto">
ffmpeg -framerate 1/${duration} -pattern_type glob -i '*.jpg' -c:v libx264 -vf "fade=t=in:st=0:d=0.5,fade=t=out:st=${count * duration - 0.5}:d=0.5" -pix_fmt yuv420p slideshow.mp4
                    </code>
                    <button onclick="downloadImageSequence(${JSON.stringify(images).replace(/"/g, '&quot;')})" 
                            class="mt-3 px-4 py-2 bg-green-500 text-white rounded">
                        📥 이미지 다운로드 스크립트
                    </button>
                </div>
            `;
        }

        // 3. GIF 변환
        async function convertGifToVideo() {
            const keyword = document.getElementById('gifInput').value;
            const resultDiv = document.getElementById('gifResult');
            
            // Giphy API 대체 (무료 GIF 소스)
            const gifUrl = `https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif`; // 예시 GIF
            
            resultDiv.innerHTML = `
                <div class="mt-4">
                    <img src="${gifUrl}" class="w-64 rounded shadow mb-4">
                    <div class="bg-purple-50 border border-purple-200 rounded p-4">
                        <p class="text-purple-700 font-semibold mb-2">GIF → MP4 변환</p>
                        <code class="bg-gray-100 p-2 rounded block text-xs">
ffmpeg -i "${gifUrl}" -movflags faststart -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" output.mp4
                        </code>
                    </div>
                </div>
            `;
        }

        // 4. 텍스트 영상
        function createTextVideo() {
            const content = document.getElementById('textContent').value;
            const bgStyle = document.getElementById('bgStyle').value;
            const fontStyle = document.getElementById('fontStyle').value;
            const resultDiv = document.getElementById('textVideoResult');
            
            const lines = content.split('\n').filter(line => line.trim());
            
            // Canvas 생성
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');
            
            // 배경 그리기
            if (bgStyle === 'gradient') {
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#FF6B6B');
                gradient.addColorStop(1, '#4ECDC4');
                ctx.fillStyle = gradient;
            } else {
                ctx.fillStyle = '#2C3E50';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 텍스트 그리기
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const fontSize = fontStyle === 'bold' ? 60 : 50;
            ctx.font = `${fontStyle === 'bold' ? 'bold' : 'normal'} ${fontSize}px Arial`;
            
            lines.forEach((line, index) => {
                const y = (canvas.height / (lines.length + 1)) * (index + 1);
                ctx.fillText(line, canvas.width / 2, y);
            });
            
            // 결과 표시
            resultDiv.innerHTML = `
                <div class="mt-4">
                    <p class="text-indigo-500 font-semibold mb-2">✅ 텍스트 영상 미리보기</p>
                    <img src="${canvas.toDataURL()}" class="w-full rounded shadow mb-4">
                    <div class="bg-indigo-50 border border-indigo-200 rounded p-4">
                        <p class="text-indigo-700 text-sm mb-2">이미지를 영상으로 변환:</p>
                        <code class="bg-gray-100 p-2 rounded block text-xs">
ffmpeg -loop 1 -i text.png -c:v libx264 -t 5 -pix_fmt yuv420p text-video.mp4
                        </code>
                    </div>
                </div>
            `;
        }

        // 이미지 다운로드 스크립트 생성
        function downloadImageSequence(images) {
            const script = images.map((url, i) => 
                `curl -o image_${String(i).padStart(3, '0')}.jpg "${url}"`
            ).join('\n');
            
            const blob = new Blob([script], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'download_images.sh';
            a.click();
        }
    </script>
</body>
</html>
